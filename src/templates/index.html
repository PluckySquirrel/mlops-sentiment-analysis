<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Phân tích Cảm xúc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #F5F7FA; font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .input-group { margin-bottom: 20px; }
        .gauge { height: 20px; background: #ddd; border-radius: 10px; overflow: hidden; }
        .gauge-fill { height: 100%; background: #4A90E2; transition: width 0.5s; }
        .negative { background: #E74C3C; }
        @media (max-width: 768px) {
            .container { padding: 10px; }
            textarea { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4" style="color: #333;">Công cụ Phân tích Cảm xúc</h1>
        <div class="input-group">
            <textarea id="textInput" class="form-control" rows="4" placeholder="Nhập văn bản để phân tích..."></textarea>
        </div>
        <div class="mb-3">
            <label class="form-check-label me-3">Phương pháp:</label>
            <input type="radio" name="method" value="analyze" id="vaderRadio" checked>
            <label for="vaderRadio" class="me-3">VADER</label>
            <input type="radio" name="method" value="predict" id="modelRadio">
            <label for="modelRadio">Mô hình tùy chỉnh</label>
        </div>
        <button id="analyzeBtn" class="btn btn-primary w-100 mb-3">Phân tích</button>
        <div id="errorMsg" class="alert alert-danger" style="display: none;"></div>
        <div id="loading" class="text-center mb-3" style="display: none;">Đang xử lý...</div>
        <div>Kết quả: <span id="result"></span></div>
        <div class="gauge mt-3">
            <div id="gaugeFill" class="gauge-fill" style="width: 0%;"></div>
        </div>
        <div class="mt-3">
            <button class="btn btn-secondary me-2" onclick="setSample('Tuyệt vời!')">Ví dụ Tích cực</button>
            <button class="btn btn-secondary" onclick="setSample('Rất tệ!')">Ví dụ Tiêu cực</button>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const result = document.getElementById('result');
        const errorMsg = document.getElementById('errorMsg');
        const loading = document.getElementById('loading');
        const gaugeFill = document.getElementById('gaugeFill');

        analyzeBtn.addEventListener('click', async () => {
            const text = textInput.value;
            if (!text.trim()) {
                errorMsg.textContent = "Lỗi: Văn bản không được để trống";
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';
            loading.style.display = 'block';
            const method = document.querySelector('input[name="method"]:checked').value;
            const url = method === 'predict' ? '/predict' : '/analyze';
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(method === 'predict' ? { review: text } : { text })
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`Server error: ${response.status} - ${JSON.stringify(errorData)}`);
                }
                const data = await response.json();
                result.textContent = `Điểm cảm xúc (${data.method}): ${data.sentiment.toFixed(2)}`;
                const width = ((data.sentiment + 1) / 2) * 100 + '%';
                gaugeFill.className = 'gauge-fill';
                if (data.sentiment < 0) gaugeFill.classList.add('negative');
                gaugeFill.style.width = width;
            } catch (error) {
                errorMsg.textContent = `Lỗi: Không thể phân tích văn bản - ${error.message}`;
                errorMsg.style.display = 'block';
            }
            loading.style.display = 'none';
        });

        function setSample(text) {
            textInput.value = text;
            analyzeBtn.click();
        }
    </script>
</body>
</html>
