name: CI/CD for Sentiment Analysis API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m nltk.downloader stopwords punkt punkt_tab

      - name: Validate datasets
        run: |
          python -c "import pandas as pd; df = pd.read_csv('data/train.csv'); assert set(['review', 'label']).issubset(df.columns)"
          python -c "import pandas as pd; df = pd.read_csv('data/test.csv'); assert set(['review', 'label']).issubset(df.columns)"

      - name: Run linting
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=.venv

      - name: Train model
        run: |
          python -m src.train_model data/train.csv data/test.csv models/

      - name: Run tests
        run: |
          pip install pytest pytest-asyncio
          pytest tests/ --verbose

      - name: Validate model
        run: |
          ls models/ | grep "sentiment_model_.*\.pkl"
          python -c "import joblib; import glob; joblib.load(glob.glob('models/sentiment_model_*.pkl')[-1])"

      - name: Test API
        run: |
          pip install uvicorn httpx
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 10
          curl -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"review":"Great movie!"}'
          kill $(lsof -t -i:8000)

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"serviceId\": \"$RENDER_SERVICE_ID\", \"clearCache\": \"do_not_clear\"}" \
            https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys
